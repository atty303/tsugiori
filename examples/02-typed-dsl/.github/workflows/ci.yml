# Generated by Tsugiori from workflows.ts
name: CI
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  hello:
    runs-on: ubuntu-24.04
    outputs:
      message: ${{ steps.greet.outputs.message }}
    steps:
      - name: Say hello
        id: greet
        run: echo "message=Hello from Tsugiori!" >> "$GITHUB_OUTPUT"

      - name: Show the ref on main
        if: ${{ (github.ref == 'refs/heads/main') }}
        run: echo 'Running on main'

  follow-up:
    runs-on: ubuntu-24.04
    needs:
      - hello
    steps:
      - name: Show the greeting
        env:
          MESSAGE: ${{ needs.hello.outputs.message }}
        run: echo "$MESSAGE"
