# Generated by Tsugiori from workflows.ts
name: Greet from the second workflow
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  greet:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - id: greeting
        uses: ./.github/actions/greet
        with:
          who: Grace

      - name: Show greeting
        env:
          MESSAGE: ${{ steps.greeting.outputs.message }}
        run: printf '%s\n' "$MESSAGE"
