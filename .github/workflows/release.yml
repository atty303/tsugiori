# Generated by Tsugiori from workflows.ts
name: release
on:
  push:
    branches:
      - main
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: tsugiori-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    if: ${{ (github.ref == 'refs/heads/main') }}
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: "false"

      - name: Install toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c

      - name: Check generated workflows
        working-directory: .github
        run: deno task tsugiori generate --check

      - name: Run repository checks and tests
        run: mise run test

      - name: Release
        env:
          FNOX_AGE_KEY: ${{ secrets.FNOX_AGE_KEY }}
        uses: atty303/repository-template/.github/actions/release@124ee84f8b01ac242d16b352f2d1e37627124724
        with:
          versioning: semver
