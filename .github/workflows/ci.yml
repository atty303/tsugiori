name: ci
on:
  pull_request: {}
  push: {}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    if: "${{ ((github.event_name == 'push') || (github.event_name == 'pull_request')) }}"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: "false"

      - name: Install toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c

      - name: Check generated workflow
        run: |-
          deno task generate:check
        working-directory: .github

      - name: Resolve task artifact
        id: tsugiori-task-artifact
        run: |-
          deno run --frozen=true -A './workflows.ts' github-actions task cache-key --expect-layout 'workflows/ci.yml/test=sha256:86e7108629fa5313e7262e26b3bf98fcfa63bf086faca9995535bacda7c9b52e'
        working-directory: .github

      - name: Cache task artifact
        id: tsugiori-task-cache
        continue-on-error: true
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: "tsugiori-task-${{ steps.tsugiori-task-artifact.outputs.artifact-key }}"
          path: "${{ steps.tsugiori-task-artifact.outputs.cache-path }}"

      - name: Prepare task artifact
        id: tsugiori-task-prepare
        run: |-
          deno run --frozen=true -A './workflows.ts' github-actions task prepare --expect-layout 'workflows/ci.yml/test=sha256:86e7108629fa5313e7262e26b3bf98fcfa63bf086faca9995535bacda7c9b52e' --expected-key '${{ steps.tsugiori-task-artifact.outputs.artifact-key }}'
        working-directory: .github

      - name: Run repository checks and tests
        run: |-
          "${{ steps.tsugiori-task-prepare.outputs.runtime-path }}" 'workflows/ci.yml/test/task-1'
